# Polymarket Arbitrage Bot Configuration

# Mode: "dry_run" (default, no real trades) or "live"
mode: dry_run

# Polygon chain ID
chain_id: 137

# API endpoints
clob_url: "https://clob.polymarket.com"
gamma_url: "https://gamma-api.polymarket.com"

# Scanning
scanning:
  poll_interval_sec: 1.0      # How often to poll via HTTP (fallback)
  market_refresh_sec: 120.0   # How often to refresh market list
  max_markets: 5000           # Maximum markets to track
  use_websocket: true         # Enable WebSocket for near-zero latency
  ws_url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  ws_reconnect_delay_sec: 2.0 # Reconnect delay on WS disconnect

# Arbitrage detection
arbitrage:
  min_profit_bps: 30          # Minimum profit in basis points (0.3%)
  min_profit_usd: 0.10        # Minimum absolute profit per arb (USD)
  fee_estimate_pct: 0.02      # Conservative fee estimate (2% of $1 payout)
  safety_margin_pct: 0.005    # Extra safety buffer on top of fees (0.5%)
  strategies:
    - multi_outcome            # NegRisk markets with 3+ outcomes
    - binary                   # YES+NO < $1 dislocations

# Execution
execution:
  order_type: FOK              # Fill-or-Kill (no partial fills)
  max_order_usd: 25.0          # Max USD per leg
  max_slippage_bps: 10         # Max acceptable price slippage
  verify_before_execute: true  # Re-check order book before each leg
  parallel_execution: false    # Execute legs in parallel (faster but riskier)
  execution_timeout_sec: 10.0  # Timeout per order placement
  gas_cost_per_leg_usd: 0.01  # Estimated gas cost per leg on Polygon
  max_exit_slippage_pct: 0.05 # Max slippage when exiting partial fills (5%)

# Risk management
risk:
  max_position_usd: 50.0      # Max total exposure ($50 balance)
  max_open_positions: 5        # Max simultaneous arb positions
  max_daily_loss_usd: 25.0    # Daily loss limit — halts trading if hit
  cooldown_after_fail_sec: 30  # Pause after failed execution
  kill_switch: false           # Emergency halt — set true to stop all trading

# Logging
logging:
  level: INFO
  trade_log: "logs/trades.jsonl"
