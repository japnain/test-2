[project]
name = "polymarket-arb"
version = "0.1.0"
description = "Polymarket arbitrage bot — exploits multi-outcome market mispricings for guaranteed profit"
requires-python = ">=3.11"
dependencies = [
    "py-clob-client>=0.34.0",
    "httpx[socks]>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
polyarb = "polyarb.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
